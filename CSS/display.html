<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* you can give linline-block when you are using display as inline
        in that the   */
        h1 {
            display: inline;
            border: 2px solid black;
            width: 100px;
            height: 200px;

        }

        span {
            display: block;
            border: 2px solid cadetblue;
            width: 100px;
            height: 200px;
        }
        h2{
            display: inline block;
            border: 2px solid black;
            width: 100px;
            height: 100px;


        }
    </style>
</head>

<body>
    <h1>Hello</h1>
    <h1>Hello</h1>
    <h1>Hello</h1>
    <h1>Hello</h1>

    <hr>

    <span>Hello</span>
    <span>Hello</span>
    <span>Hello</span>
    <span>Hello</span>

    <hr>
    <h2>Hello</h2>
    <h2>Hello</h2>
    <h2>Hello</h2>
    <h2>Hello</h2>




</body>

</html>
