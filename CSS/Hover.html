<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Effects</title>
    <style>
        /* body: background and basic page styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* container: center all hover examples */
        .container {
            text-align: center;
            width: 80%;
            max-width: 700px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        /* h1: page heading */
        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        /* box: basic square block */
        .box {
            width: 180px;
            height: 180px;
            margin: 20px auto;
            background: #4CAF50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.5s ease;
            cursor: pointer;
        }

        /* .box:hover: when mouse is over box */
        .box:hover {
            background: #2e7d32;
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* button: basic button styling */
        button {
            padding: 12px 24px;
            margin: 15px;
            border: none;
            border-radius: 8px;
            background: #2196F3;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        /* button:hover: change button on hover */
        button:hover {
            background: #1976D2;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        /* a: hyperlink styling */
        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #333;
            font-size: 20px;
            padding: 8px 16px;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        /* a:hover: underline and color change */
        a:hover {
            color: #e91e63;
            border-bottom-color: #e91e63;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- h1 is a heading tag, used for page title -->
        <h1>Hover Effect Examples</h1>

        <!-- div with class box creates a square box -->
        <div class="box">Hover Me</div>

        <!-- button is a clickable element -->
        <button>Click Me</button>

        <!-- a tag is a hyperlink -->
        <a href="#">Visit Website</a>
    </div>
</body>
</html>

<!--
    Basic explanation:
    1. HTML creates the structure of the page.
    2. CSS adds style and design.
    3. :hover is a CSS pseudo-class. It works when mouse is over an element.
    4. transition gives smooth animation effect.
    5. transform: scale() enlarges the element.
    6. box-shadow adds shadow to make the box look better.
    7. button:hover changes the button style when hovered.
    8. a:hover changes link color and underlines it.
    9. This is a basic hover effect demo.
-->
