<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body align="center">

    <!--***** video tag ******* -->
    <video src="https://www.pexels.com/download/video/38088896/" width="600px"  autoplay muted loop></video>  <hr>

    <!-- this is video tag. video tag is used to embed video in html. autoplay, muted and loop are attributes of video tag. autoplay
      is used to play the video automatically, muted is used to mute the video and loop is used to play the video in loop -->
    

    <!-- ***** local path ***** -->
    <video src="ASSEST\video.mp4" width="600px"  controls ></video>  <hr>
    <!-- this is local path video. video tag is used to embed video in html.autoplay, muted and loop are attributes of video tag.
      autoplay is used to play the video automatically, muted is used to mute the video and loop is used to play the video in loop -->
    


    <!-- ***** audio tag ***** -->
    <audio src="ASSEST\audio.mp3" controls></audio><hr>
    <!-- this is audio tag. audio tag is used to embed audio in html. controls is an attribute of audio tag.
      controls is used to display the audio player -->

    <!-- ***** iframe tag ***** -->

     <!-- this is iframe tag. iframe tag is used to embed another html page in the current html page. src is an attribute of iframe tag.
      src is used to specify the url of the page to be embedded. frameborder is an attribute of iframe tag. frameborder is used to specify the  
      border of the iframe. height and width are attributes of iframe tag. height and width are used to specify the height and width of the iframe -->
    
    <!-- external website -->
      <iframe src="https://www.wikipedia.org/" frameborder="0" height="500px" width="600px"></iframe> 
      <!-- this is iframe tag. iframe tag is used to embed another html page in the current html page. src is an attribute of iframe tag.-->
      <hr>

      <!-- internal webpage -->
       <iframe src="image.html" frameborder="0" height="500px" width="600px"></iframe><hr>
       <!-- this is an iframe embedding an internal webpage -->

       <!-- google maps -->
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7777.923763455284!2d77.59802713207277!3d12.910171507279694!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae151cb968aba3%3A0x54297959fdf4a58d!2sIndustrial%20Area%2C%20BTM%20Layout%202nd%20Stage%2C%20BTM%20Layout%2C%20Bengaluru%2C%20Karnataka!5e0!3m2!1sen!2sin!4v1786079344808!5m2!1sen!2sin"
         width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <!-- YouTube video -->

        <iframe width="560" height="315" src="https://www.youtube.com/embed/uZdmAT_W46w?si=DSXTLdBHQz1D4Rtk" title="YouTube video player" frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <!-- this is an iframe embedding a YouTube video. src is an attribute of iframe tag. src is used to specify the url of the page to be 
         embedded. frameborder is an attribute of iframe tag. frameborder is used to specify the border of the iframe. height and width are 
         attributes of iframe tag. height and width are used to specify the height and width of the iframe. allowfullscreen is an attribute of 
         iframe tag. allowfullscreen is used to allow the video to be played in fullscreen mode. -->
       
</body>
</html>
