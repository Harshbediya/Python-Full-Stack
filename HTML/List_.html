```html
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- <head> contains information/settings about the webpage -->
    <meta charset="UTF-8">
    <!-- <meta charset> defines the character encoding -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <meta name="viewport"> makes the webpage responsive on different devices -->

    <title>Document</title>
    <!-- <title> defines the title shown on the browser tab -->
</head>

<body>
    <!-- <body> contains all the visible content of the webpage -->

    <!-- ==================== ORDERED LIST ==================== -->

    <!-- <ol> = Ordered List
         Used to create a numbered/ordered list -->

    <ol type="1">
        <!-- type="1" displays numbers: 1, 2, 3 -->

        <li>Python</li>
        <!-- <li> = List Item -->

        <li>Python</li>
        <li>Python</li>
    </ol>


    <ol type="A">
        <!-- type="A" displays uppercase letters: A, B, C -->

        <li>Python</li>
        <li>Python</li>
        <li>Python</li>
    </ol>


    <ol type="a">
        <!-- type="a" displays lowercase letters: a, b, c -->

        <li>Python</li>
        <li>Python</li>
        <li>Python</li>
    </ol>


    <ol type="I">
        <!-- type="I" displays uppercase Roman numbers: I, II, III -->

        <li>Python</li>
        <li>Python</li>
        <li>Python</li>
    </ol>


    <!-- ==================== UNORDERED LIST ==================== -->

    <!-- <ul> = Unordered List
         Used to create a list with bullets -->

    <ul>
        <!-- Default bullet is usually a disc (•) -->

        <li>English</li>
        <li>SQL</li>
        <li>Python</li>
    </ul>


    <ul type="circle">
        <!-- type="circle" displays hollow circle bullets (○) -->

        <li>English</li>
        <li>SQL</li>
        <li>Python</li>
    </ul>


    <ul type="square">
        <!-- type="square" displays square bullets (■) -->

        <li>English</li>
        <li>SQL</li>
        <li>Python</li>
    </ul>


    <!-- ==================== DESCRIPTION LIST ==================== -->

    <!-- <dl> = Description List
         Used to display a term and its description -->

    <dl>
        <!-- <dl> creates the description list container -->

        <dt>Python</dt>
        <!-- <dt> = Description Term
             Contains the term/name -->

        <dd>A programming language</dd>
        <!-- <dd> = Description Details
             Contains the description of the term -->
    </dl>

</body>
</html>
```
