<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body bgcolor="#F6F1DB">

    <!-- Student Information Form -->

    <form action="">

        <fieldset>
            <legend>
                <h2>Student-Details</h2>
            </legend>
            <fieldset>
                <legend><strong>
                        <h3>Personal</h3>
                    </strong></legend>
              <label for="First Name"><strong>First Name: </strong></label>
              <td><input type="text"></td>
              <br><br>

                <label for="First Name"><strong>Last Name: </strong></label>
                <td><input type="text"></td>
                <br><br>
                <label for="First Name"><strong>Father's Name: </strong></label>
                <input type="text"><br><br>

                <label for="First Name"><strong>Mother's Name: </strong></label>
                <input type="text"><br><br>

                <label for="date"><strong>DOB</strong></label>
                <input type="date"><br><br>

                <label for="date"><strong>Gender:</strong></label>
                <input type="radio" name="male" value="male">
                <label for="male">Male</label>
                <input type="radio" name="female" value="female">
                <label for="female">Female</label>
                <input type="radio" name="others" value="others">
                <label for="others">Others</label><br><br>

                <label for=""><strong>Blood Group:</strong></label>
                <select name="blood-group" id="">
                    <option value="">---- Choose ----</option>
                    <option value="">A+</option>
                    <option value="">B+</option>
                    <option value="">A-</option>
                    <option value="">B-</option>
                    <option value="">O+</option>
                    <option value="">O-</option>
                    <option value="">AB+</option>
                </select>
            </fieldset>

            <fieldset>
                <legend><strong>
                        <h3>Contact</h3>
                    </strong></legend>
                <label for="First Name"><strong>Mobile no: </strong></label>
                <input type="text"><br><br>

                <label for="First Name"><strong>Mail id: </strong></label>
                <input type="text" placeholder="example@gmail.com"><br><br>

                <label for="First Name"><strong>Address: </strong></label>
                <input type="text" placeholder="House no. Street Name"><br><br>
                <input type="text" placeholder="Line1">
                <input type="text" placeholder="Line2">
                <br><br>

                <label for="First Name"><strong>Country: </strong></label>
                <select name="country" id="">
                    <option value="">---- Choose ----</option>
                    <option value="">India</option>
                    <option value="">USA</option>
                    <option value="">UK</option>
                    <option value="">Canada</option>
                    <option value="">Australia</option>
                </select><br><br>
                <label for="First Name"><strong>State: </strong></label>
                <select name="state" id="">
                    <option value="">---- Choose ----</option>
                    <option value="">Madhya Pradesh</option>
                    <option value="">Maharashtra</option>
                    <option value="">Karnataka</option>
                    <option value="">London</option>
                </select><br><br>
                <label for="First Name"><strong>Pin Code: </strong></label>
                <input type="text" placeholder="123456">
                <br><br>


                <fieldset>

                    <legend><strong>
                            <h3>Education</h3>
                        </strong></legend>
                    <label for="First Name"><strong>Highest Degree: </strong></label>
                    <select name="" id="">
                        <option value="">---- Choose ----</option>
                        <option value="">B.Tech</option>
                        <option value="">M.Tech</option>
                        <option value="">B.Sc</option>
                        <option value="">M.Sc</option>
                        <option value="">BCA</option>
                        <option value="">MCA</option>
                    </select><br><br>

                    <label for="First Name"><strong>Stream: </strong></label>
                    <input type="radio" name="stream" value="Computer Science"><label for="First Name">Computer
                        Science</label>
                    <input type="radio" name="stream" value="Electronics"><label for="First Name">Electronics</label>
                    <input type="radio" name="stream" value="Mechanical"><label for="First Name">Mechanical</label>
                    <input type="radio" name="stream" value="it"><label for="First Name">IT</label><br><br>

                    <label for="First Name"><strong>If Other: </strong> </label>
                    <input type="text" name="otherStream" placeholder=""><br><br>

                    <label for="First Name"><strong>Passing Year: </strong></label>
                    <select name="passingYear" id="">
                        <option value="">---- Choose ----</option>
                        <option value="2020">2026</option>
                        <option value="2019">2025</option>
                        <option value="2018">2024</option>
                        <option value="2017">2023</option>
                    </select><br><br>

                    <label for="First Name"><strong>University: </strong></label>
                    <input type="text"><br><br>

                    <label for="First Name"><strong>Percentage: </strong></label>
                    <input type="text" placeholder=""><br> <br>

                </fieldset>

                <fieldset>
                    <legend><strong>
                            <h3>Placement</h3>
                        </strong></legend>
                    <label for="First Name"><strong>Skills: </strong></label>
                    <input type="checkbox"><label for="">HTML</label>
                    <input type="checkbox"><label for="">CSS</label>
                    <input type="checkbox"><label for="">JS</label><br><br>
                    <input type="checkbox"><label for="">React</label>
                    <input type="checkbox" name="skills" value="C"><label for="First Name">C</label>
                    <input type="checkbox" name="skills" value="Java"><label for="First Name">Java</label>
                    <input type="checkbox" name="skills" value="Python"><label for="First Name">Python</label><br><br>

                    <label for="First Name"><strong>Domain: </strong></label><br><br>
                    <input type="radio"><label for="">Testing</label>
                    <input type="radio"><label for="">Devops</label>
                    <input type="radio" name="skills" value="C"><label for="First Name">Dev</label>
                    <br><br>

                    <label for="First Name"><strong>Place of Preference: </strong></label><br><br>
                    <input type="radio"><label for="">Banglore</label>
                    <input type="radio"><label for="">Pune</label>
                    <input type="radio"><label for="">Banglore</label><br><br>

                    
                    <label for="First Name"><strong>Expecting Salary: </strong></label><br><br> 
                    <input type="radio"><label for="">6-10 LPA</label>
                    <input type="radio"><label for="">More than 10 LPA</label>
                    <input type="radio"><label for="">No Expection</label><br><br>

                   

                </fieldset>



            </fieldset>

            <fieldset>
                <legend><strong>
                        <h3>Create Account</h3>
                    </strong></legend>
                <label for="">User Name:</label>
                <input type="text" placeholder="User Name"><br><br>
                <label for="">Password:</label>
                <input type="password" placeholder="Password"><br><br>
                <label for="">Re-Enter:</label>
                <input type="password" placeholder=" Re-Enter"><br><br>
                <input type="checkbox"><label for="First Name"><b>Agree Terms & Condition</b></label><br><br>
                <button>Submit</button>
                <button>Reset</button>


            </fieldset>








    </form>

</body>

</html>
