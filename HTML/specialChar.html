<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- Special Characters in HTML -->

    <h1>Copyright => PYSPIDERS&copy;</h1>   <!-- Copyright symbol -->
    <h1>Trademark => PYSPIDERS&trade;</h1>  <!-- Trademark symbol -->
    <h1>heart => PYSPIDERS&hearts;</h1>     <!-- Heart symbol -->
    <h1>Registered => PYSPIDERS&reg;</h1>   <!-- Registered symbol -->
    <h1>Ampersand => PYSPIDERS&amp;</h1>    <!-- Ampersand symbol -->
    <h1>Asterisk => PYSPIDERS&ast;</h1>     <!-- Asterisk symbol -->

    <h1>Quoter => PYSPIDERS&rdquo;</h1>     <!-- Right double quotation mark -->
    <h1>Cent => PYSPIDERS&cent;</h1>        <!-- Cent symbol -->
    <h1>A => PYSPIDERS&#65;</h1>            <!-- Capital A -->
    <h1>Fraction => PYSPIDERS&frac12;</h1>  <!-- Fraction one-half -->
    <h1>Grater Than => PYSPIDERS&gt;</h1>   <!-- Greater than symbol -->
    <h1>Less than => PYSPIDERS&lt;</h1>     <!-- Less than symbol -->
    <h1>HEllo &nbsp;&nbsp;&nbsp; wold</h1>  <!-- Non-breaking space --> 
</body>
</html>
