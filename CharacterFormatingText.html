<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- Character Formationg Text Tags -->
    <br>
    <b>This is Bold Text Tag</b>          <!-- this is bold text tag -->
    <strong>This is strong text</strong>  <!-- this is strong text tag -->
    <hr>

    <i>This is italic text</i>             <!-- this is italic text tag -->
    <em>This is inserted text</em>         <!-- this is inserted text tag -->
    <hr>

    <u>This is underlined text</u>
    <ins>This is underlined text</ins>     <!-- this is underlined text tag -->
    <hr>

    <small>This is small Text tag</small>  <!-- this is small text tag -->
    <hr>
    <big>This is Big Text Tag</big>        <!-- this is big text tag -->
    <hr>
    <mark>This is mark Tag</mark>          <!-- this is mark text tag -->
    <hr>
    <strike>This is symentic</strike>      <!-- this is strike text tag. strike is deprecated, use <del> instead -->
    <hr>
    <del>This is delete Tag</del>         <!-- this is delete text tag -->
    <hr>
    <q>This is Quoted Text</q>            <!-- this is quoted text tag -->
    <hr>

    <abbr title="This describe abbravation of text">Abbrivation text</abbr> <!-- this is abbr text tag. abbreviation use <abbr> for used text per -->
    <hr>
    <bdo dir="rtl">Bidirectional text</bdo>  <!-- this is bidirectional text tag. bdo use for change text direction -->
                                            <!-- This change text side left to right and right to left --> 
    <hr>
    <h1>H<sub>2</sub>O</h1>   <!-- this is subscript text tag. sub use for small text below the text.example: H2O -->
    <hr>]
</body>
</html>

<!-- Notes to Remember -->
<!-- - <b> and <strong> are both used for bold text, but <strong> indicates importance -->
<!-- - <i> and <em> are both used for italic text, but <em> indicates emphasis -->
<!-- - <u> and <ins> are both used for underlined text, but <ins> indicates inserted text -->
<!-- - <small> is used for smaller text -->
<!-- - <big> is used for larger text -->
<!-- - <mark> is used to highlight text -->
<!-- - <strike> is deprecated, use <del> instead -->
<!-- - <q> is used for inline quotations -->
<!-- - <abbr> is used for abbreviations -->

<!-- - <sub> is used for subscript text -->
